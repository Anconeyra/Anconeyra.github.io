# OpenSpec Configuration — Anconeyra.github.io
# Generated by sdd-init (openspec mode) — 2026-09-09
# See: /root/.config/opencode/skills/_shared/openspec-convention.md

schema: spec-driven
project: Anconeyra.github.io
mode: openspec
default_change: nextjs-vercel-migration

context: |
  Tech stack: Static HTML5/CSS3/Vanilla JS (ES6+, no build, no package.json); target Next.js 14+ App Router + TypeScript on Vercel.
  Architecture: Single-page portfolio (hero/about/skills/certs/projects/contact), vanilla JS modules, CSS variables; migration to component-based Next.js SSG.
  Hosting: GitHub Pages (current, origin https://github.com/Anconeyra/Anconeyra.github.io.git) -> Vercel (target), preserve OG/meta/structured-data SEO.
  Style: Clean principles, responsive + a11y-aware, Poppins + Font Awesome; conventional commits, no AI attribution.

testing:
  strict_tdd: false
  reason: "No test runner detected in static site; TDD will be enabled after Next.js bootstrap (Vitest/Jest + Playwright recommended)."
  runner:
    command: ""
    framework: none
  layers:
    unit: { available: false, tool: "-" }
    integration: { available: false, tool: "-" }
    e2e: { available: false, tool: "-" }
  coverage:
    available: false
    command: "-"
  quality:
    linter: { available: false, command: "-" }
    type_checker: { available: false, command: "- (TypeScript after migration)" }
    formatter: { available: false, command: "- (Prettier after migration)" }

delivery:
  strategy: ask-always
  review_budget_lines: 400
  execution_mode: interactive

rules:
  proposal:
    - Include rollback plan for hosting migration (Vercel -> GitHub Pages fallback)
    - Document SEO preservation (Open Graph, Twitter Card, JSON-LD, meta tags)
    - Clarify domain and redirect strategy (anconeyra.github.io)
  specs:
    - Use Given/When/Then for scenarios
    - Use RFC 2119 keywords (MUST, SHALL, SHOULD, MAY)
    - Cover SEO, accessibility, and performance requirements explicitly
    - One spec per domain (e.g., routing, ui, seo, deployment)
  design:
    - Include Next.js App Router structure and component decomposition
    - Document architecture decisions with rationale and tradeoffs (SSG vs SSR, image optimization)
    - Reference Vercel deployment, env, and CI strategy
    - Include sequence diagrams for complex flows (theme toggle, terminal, particles)
  tasks:
    - Group by phase (setup, migration, verification, deployment)
    - Use hierarchical numbering (1, 1.1, 1.2)
    - Keep tasks completable in one session (<400 lines per PR)
    - Include testing tasks once runner is bootstrapped
  apply:
    tdd: false
    test_command: ""
    build_command: "npm run build"
    follow_patterns: true
  verify:
    test_command: ""
    build_command: "npm run build"
    coverage_threshold: 0
    checks:
      - "next build succeeds without errors"
      - "Lighthouse SEO/Perf scores >= current static site"
      - "All anchors and sections render correctly"
      - "Theme toggle, terminal, particles, scroll animations parity-checked"
  archive:
    - Warn before merging destructive deltas
    - Preserve SEO metadata lineage
